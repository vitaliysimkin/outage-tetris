<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Тетріс: графік відключень</title>
<link rel="icon" href="assets/icons/elec-off.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <h1>Тетріс: графік відключень</h1>

  <div class="hud">
    <div class="hud-box">
      <span class="hud-label">Рахунок</span>
      <span class="hud-value" id="score">0</span>
    </div>
    <div class="hud-box">
      <span class="hud-label">Рядки</span>
      <span class="hud-value" id="rows">0</span>
    </div>
    <div class="hud-box">
      <span class="hud-label">Рівень</span>
      <span class="hud-value" id="level">1</span>
    </div>
    <div class="hud-box next-box">
      <span class="hud-label">Далі</span>
      <canvas id="next-piece" class="next-piece" width="64" height="64"></canvas>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="board" class="board"></canvas>
    <div id="overlay" class="overlay hidden">
      <p id="overlay-text">Пауза</p>
      <button id="overlay-btn" class="ctrl-btn wide">Старт</button>
    </div>
  </div>

  <div class="controls">
    <button id="btn-left" class="ctrl-btn round" title="Вліво">◀</button>
    <button id="btn-rotate" class="ctrl-btn round" title="Обертати">↻</button>
    <button id="btn-right" class="ctrl-btn round" title="Вправо">▶</button>
    <button id="btn-down" class="ctrl-btn round" title="Вниз">▼</button>
    <button id="btn-drop" class="ctrl-btn round" title="Скинути">⤓</button>
  </div>

  <div class="controls secondary">
    <button id="btn-pause" class="ctrl-btn wide">⏸ Пауза</button>
    <button id="btn-reset" class="ctrl-btn wide">↺ Нова гра</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
